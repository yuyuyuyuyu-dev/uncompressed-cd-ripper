name: Tests

on:
  workflow_call:

jobs:
  windows-test:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --all-features
        working-directory: src-tauri
