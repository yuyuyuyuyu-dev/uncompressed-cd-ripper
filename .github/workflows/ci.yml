name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  biome:
    name: Biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run biome ci

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: ./.github/actions/setup-udev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: pnpm install --frozen-lockfile
      - run: pnpm run tsc --noEmit

  typescript-test:
    name: TypeScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: ./.github/actions/setup-udev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run vitest run

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check
        working-directory: src-tauri

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: ./.github/actions/setup-udev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: ./.github/actions/setup-udev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --all-features
        working-directory: src-tauri

  rip:
    name: should rip as FLAC Uncompressed
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: brew install libcdio libcdio-paranoia flac

      - name: Put a disc in the drive
        run: |
          .github/scripts/make-a-test-disc.py "$GITHUB_WORKSPACE"
          chmod 444 disc.bin disc.cue

      - run: |
          cargo run --example rip -- \
            --disc "$GITHUB_WORKSPACE/disc.cue" -o "$GITHUB_WORKSPACE/ripped"
        working-directory: src-tauri

      - name: It reads back as the audio that was on the disc
        run: |
          flac --decode --force-raw-format --endian=little --sign=signed \
            --output-name=decoded.raw ripped/01.flac
          cmp decoded.raw disc.bin

      - name: Every sample in it is stored as it arrived
        run: |
          flac --analyze ripped/01.flac
          test "$(grep -o 'type=[A-Z]*' ripped/01.ana | sort -u)" = "type=VERBATIM"
          test "$(grep -o 'channel_assignment=[A-Z_]*' ripped/01.ana | sort -u)" \
             = "channel_assignment=INDEPENDENT"

      - name: The reference implementation accepts it
        run: flac --test ripped/01.flac

      - name: Its blocks are the fixed size it says they are
        run: |
          test "$(metaflac --show-min-blocksize ripped/01.flac)" \
             = "$(metaflac --show-max-blocksize ripped/01.flac)"

      - name: Apple's decoder plays it
        run: afconvert -f WAVE -d LEI16 ripped/01.flac played.wav

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: the-disc-and-what-came-off-it
          path: |
            disc.bin
            ripped/01.flac

  metadata:
    name: should write the fetched metadata into the file a track is ripped to
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: ./.github/actions/setup-udev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sudo apt-get install --yes flac

      - name: Put a disc in the drive
        run: |
          .github/scripts/make-a-test-disc.py "$GITHUB_WORKSPACE"
          chmod 444 disc.bin disc.cue

      - name: Rip it as a disc that was looked up
        run: |
          cargo run --example rip -- \
            --disc "$GITHUB_WORKSPACE/disc.cue" -o "$GITHUB_WORKSPACE/ripped" \
            --album-name "Sea Change" --album-artist-name "Marina Blue" \
            --track-title "Harbour Lights"
        working-directory: src-tauri

      - name: A player reads back what the lookup answered
        run: |
          ls -la ripped
          metaflac --export-tags-to=- "ripped/01 - Harbour Lights.flac" | tee tags.txt
          grep -qxF 'TITLE=Harbour Lights' tags.txt
          grep -qxF 'ARTIST=Marina Blue' tags.txt
          grep -qxF 'ALBUM=Sea Change' tags.txt
          grep -qxF 'ALBUMARTIST=Marina Blue' tags.txt
          grep -qxF 'TRACKNUMBER=1' tags.txt

  artwork:
    name: should write the chosen album artwork into the file a track is ripped to
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: ./.github/actions/setup-udev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sudo apt-get install --yes flac

      - name: Put a disc in the drive
        run: |
          .github/scripts/make-a-test-disc.py "$GITHUB_WORKSPACE"
          chmod 444 disc.bin disc.cue

      - name: Put artwork on this computer
        run: |
          base64 --decode > artwork.png <<'PNG'
          iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGP4z8AAAAMBAQDJ/pLvAAAAAElFTkSuQmCC
          PNG

      - name: Rip it with artwork chosen from this computer
        run: |
          cargo run --example rip -- \
            --disc "$GITHUB_WORKSPACE/disc.cue" -o "$GITHUB_WORKSPACE/ripped" \
            --album-artwork "$GITHUB_WORKSPACE/artwork.png"
        working-directory: src-tauri

      - name: A player finds the artwork that was chosen
        run: |
          metaflac --list --block-type=PICTURE ripped/01.flac | tee block.txt
          grep -qF 'MIME type: image/png' block.txt
          metaflac --export-picture-to=exported.png ripped/01.flac
          cmp artwork.png exported.png

  read-offset:
    name: should correct for the drive's read offset (reading ${{ matrix.reads }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - reads: late
            frames: 667
          - reads: early
            frames: -667
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: ./.github/actions/setup-udev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sudo apt-get install --yes flac

      - name: Record the audio a disc is meant to hold
        run: |
          .github/scripts/make-a-test-disc.py "$GITHUB_WORKSPACE"
          mv disc.bin recorded.bin
          chmod 444 recorded.bin disc.cue

      - name: Cut the disc such a drive hands over
        run: |
          .github/scripts/cut-the-disc-a-drive-hands-over.py \
            recorded.bin ${{ matrix.frames }} disc.bin
          chmod 444 disc.bin

      - name: Rip it, told what the drive is out by
        run: |
          cargo run --example rip -- \
            --disc "$GITHUB_WORKSPACE/disc.cue" -o "$GITHUB_WORKSPACE/ripped" \
            --read-offset ${{ matrix.frames }}
        working-directory: src-tauri

      - name: What was recorded comes back
        run: |
          flac --decode --force-raw-format --endian=little --sign=signed \
            --output-name=came-off.raw ripped/01.flac
          .github/scripts/compare-what-came-off-the-disc.py \
            came-off.raw recorded.bin ${{ matrix.frames }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: the-disc-a-${{ matrix.reads }}-drive-hands-over
          path: |
            recorded.bin
            disc.bin
            came-off.raw

  checksums:
    name: should work out the same AccurateRip checksums as another implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: ./.github/actions/setup-udev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Fetch the other implementation
        run: |
          python3 -m venv theirs
          theirs/bin/pip install --no-deps ARver

      - name: Put a disc in the drive
        run: |
          .github/scripts/make-a-test-disc.py "$GITHUB_WORKSPACE"
          chmod 444 disc.bin disc.cue

      - name: Rip it, and take down what it made of the track
        run: |
          cargo run --example rip -- \
            --disc "$GITHUB_WORKSPACE/disc.cue" -o "$GITHUB_WORKSPACE/ripped" \
            > "$GITHUB_WORKSPACE/ours.txt"
        working-directory: src-tauri

      - name: The other implementation works out the same two numbers
        run: |
          theirs/bin/python \
            .github/scripts/checksums-from-another-implementation.py \
            ripped/01.flac 1 1 > theirs.txt
          ours="$(awk '{ print $2, $3 }' ours.txt)"
          theirs="$(cat theirs.txt)"
          echo "ours:   $ours"
          echo "theirs: $theirs"
          test "$ours" = "$theirs"

  disc-writes:
    name: should not write to a disc
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: The runner can run a machine inside itself
        run: test -e /dev/kvm

      - run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-x86 qemu-utils cloud-image-utils
          sudo chmod 666 /dev/kvm

      - name: Use the drive while the kernel writes down what it is asked
        run: .github/scripts/collect-the-commands-the-drive-is-sent.sh

      - name: The drive was asked for the audio
        run: grep -qE 'raw=(be|28) ' drive.txt

      - name: The drive was never asked to write
        run: |
          ! grep -qE 'cmnd=\((WRITE|ERASE|BLANK|FORMAT_UNIT|CLOSE_TRACK|RESERVE_TRACK)' drive.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: commands-the-drive-was-sent
          path: |
            drive.txt
            trace.txt
            vm-console.log

  disc-insertion:
    name: should detect disc insertion automatically
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: The runner can run a machine inside itself
        run: test -e /dev/kvm

      - run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-x86 qemu-utils cloud-image-utils
          sudo chmod 666 /dev/kvm

      - name: Put a disc in while the app watches the drive
        run: .github/scripts/put-a-disc-in-and-take-it-out-while-the-app-watches.sh

      - name: It was watching before the disc went in
        run: |
          cat watched.txt
          test "$(head -1 watched.txt)" = watching

      - name: The drive the disc went into turned up
        run: grep -qE '^holding /dev/' watched.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: what-the-app-noticed-a-disc-going-in
          path: |
            watched.txt
            watching-errors.txt
            vm-console.log

  disc-removal:
    name: should detect disc removal automatically
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: The runner can run a machine inside itself
        run: test -e /dev/kvm

      - run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-x86 qemu-utils cloud-image-utils
          sudo chmod 666 /dev/kvm

      - name: Take the disc out again while the app watches the drive
        run: .github/scripts/put-a-disc-in-and-take-it-out-while-the-app-watches.sh

      - name: It had the drive while the disc was in
        run: |
          cat watched.txt
          grep -qE '^holding /dev/' watched.txt

      - name: Nothing was left holding a disc once it came out
        run: test "$(grep '^holding ' watched.txt | tail -1)" = 'holding none'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: what-the-app-noticed-a-disc-coming-out
          path: |
            watched.txt
            watching-errors.txt
            vm-console.log

  eject:
    name: should eject the disc when asked to
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: The runner can run a machine inside itself
        run: test -e /dev/kvm

      - run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-x86 qemu-utils cloud-image-utils
          sudo chmod 666 /dev/kvm

      - name: Ask the app to eject the disc in the drive
        run: .github/scripts/ask-the-app-to-eject-the-disc.sh

      - name: The app had the drive the disc was in
        run: |
          cat ejected.txt
          grep -qE '^holding /dev/' ejected.txt

      - name: It said the disc came out
        run: grep -qE '^ejected /dev/' ejected.txt

      - name: The drive was holding the disc before
        run: |
          cat drive-with-the-disc-in.txt
          grep -q /tmp/disc.cue drive-with-the-disc-in.txt

      - name: Nothing was left in the drive
        run: |
          cat drive-once-it-was-ejected.txt
          ! grep -q /tmp/disc.cue drive-once-it-was-ejected.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: what-the-app-did-when-asked-to-eject
          path: |
            ejected.txt
            ejecting-errors.txt
            drive-with-the-disc-in.txt
            drive-once-it-was-ejected.txt
            vm-console.log

  file-side-effects:
    name: should not create, modify or delete unrelated files or directories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yuyuyuyuyu-dev/assert-no-unexpected-changes@v1
        with:
          arrange: |
            apt-get update
            apt-get install --yes \
              libwebkit2gtk-4.1-dev \
              build-essential \
              curl \
              wget \
              file \
              libxdo-dev \
              libssl-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev
            apt-get install --yes \
              libcdio-dev \
              libcdio-cdda-dev \
              libcdio-paranoia-dev \
              libudev-dev \
              libclang-dev \
              pkg-config
            apt-get install --yes ca-certificates
            rm -rf /var/lib/apt/lists/*
            export VOLTA_HOME=/usr/local/volta
            export PATH="$VOLTA_HOME/bin:$PATH"
            curl --proto '=https' --tlsv1.2 --silent --show-error --fail https://get.volta.sh \
              | bash -s -- --skip-setup
            node --version
            node_bin="$(dirname "$(volta which node)")"
            "$node_bin/corepack" enable --install-directory "$VOLTA_HOME/bin"
            "$node_bin/corepack" install
            pnpm install --frozen-lockfile
            pnpm exec playwright install --with-deps chromium
            curl --proto '=https' --tlsv1.2 --silent --show-error --fail https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            (cd src-tauri && cargo install --locked --features cli cargo-about)
            pnpm run generate-bindings
            pnpm run generate-licenses
            cd src-tauri
            cargo fetch --locked
          act: |
            export VOLTA_HOME=/usr/local/volta
            export PATH="$VOLTA_HOME/bin:$HOME/.cargo/bin:$PATH"
            pnpm run vitest run
            cd src-tauri
            cargo test --all-features
          allowlist: |
            /root/.cache/ms-playwright/*
            /var/cache/fontconfig/*
            /root/.cargo/.global-cache
