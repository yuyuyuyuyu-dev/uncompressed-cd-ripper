name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  biome:
    name: Biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run biome ci

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm run tsc --noEmit

  typescript-test:
    name: TypeScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run vitest run

  # The Rust jobs install no toolchain: rustup ships on the runner and honours
  # src-tauri/rust-toolchain.toml, installing the pinned version and the
  # components listed there on the first cargo invocation.
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check
        working-directory: src-tauri

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --all-features
        working-directory: src-tauri

  # On macOS because of the last assertion. Apple's decoder is the one that
  # refused a file every other decoder accepted, so it is the one worth asking,
  # and it only exists here.
  rip:
    name: should rip as FLAC Uncompressed
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # libcdio to read the disc with, and the reference FLAC tools to judge
      # what comes out by something other than the library that wrote it.
      - run: brew install libcdio libcdio-paranoia flac

      # libcdio reads a disc image through the same driver interface it reads a
      # drive through, so a runner with no optical drive can still be handed a
      # disc. The audio is random because the assertions below compare against
      # it: a pattern could be reproduced by an encoder that lost the original.
      - name: Put a disc in the drive
        run: |
          head -c $((2352 * 750)) /dev/urandom > disc.bin
          printf 'FILE "disc.bin" BINARY\n  TRACK 01 AUDIO\n    INDEX 01 00:00:00\n' > disc.cue
          chmod 444 disc.bin disc.cue

      - run: cargo run --example rip -- "$GITHUB_WORKSPACE/disc.cue" "$GITHUB_WORKSPACE/ripped"
        working-directory: src-tauri

      # Uncompressed, which for audio that cannot be compressed anyway is said
      # by the file being no smaller than the audio that went into it.
      - name: The file is no smaller than the audio
        run: |
          test "$(stat -f%z ripped/01.flac)" -ge "$(stat -f%z disc.bin)"

      - name: The reference implementation accepts it
        run: flac --test ripped/01.flac

      - name: It reads back as the audio that was on the disc
        run: |
          flac --decode --force-raw-format --endian=little --sign=signed \
            --output-name=decoded.raw ripped/01.flac
          cmp decoded.raw disc.bin

      # Not about decoding at all: a FLAC file states the smallest of its
      # blocks excluding the last, so a stream with a fixed block size states
      # the same number twice. Get it wrong and the file still decodes
      # everywhere else while Apple refuses it, which is what shipped once.
      - name: Its blocks are the fixed size it says they are
        run: |
          test "$(metaflac --show-min-blocksize ripped/01.flac)" \
             = "$(metaflac --show-max-blocksize ripped/01.flac)"

      # What it comes down to: the decoder that would not play the broken file
      # plays this one. afconvert rather than afplay because a runner has no
      # audio hardware, and the Null Audio Device it is given instead fails to
      # appear about a third of the time. Both put the file through the same
      # Core Audio decoder; only one of them needs a speaker.
      - name: Apple's decoder plays it
        run: afconvert -f WAVE -d LEI16 ripped/01.flac played.wav

  disc-writes:
    name: should not write to a disc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # A virtual SCSI host adapter. What it offers is an optical drive as far
      # as the kernel is concerned, so the app reaches it through the driver it
      # would use on somebody's desk rather than through a file it could tell
      # was a file. The daemon behind it answers the commands.
      #
      # The module is built here because nobody packages it for Ubuntu: the
      # CDEmu PPA carries the daemon and its client and stops there. The
      # tarball is pinned by hash, since a build that downloads a kernel module
      # ought to be able to say which one it got.
      - name: Fit a drive
        env:
          VHBA: vhba-module-20240917
          VHBA_SHA256: ce34cbae2c36cef8d7d09c5f6bd42d6871b9b530bb70b4ca100f964823fe0e98
        run: |
          set -eux
          sudo add-apt-repository -y ppa:cdemu/ppa
          sudo apt-get install -y cdemu-daemon cdemu-client "linux-headers-$(uname -r)"

          curl -fsSL -o vhba.tar.xz \
            "https://sourceforge.net/projects/cdemu/files/vhba-module/$VHBA.tar.xz/download"
          echo "$VHBA_SHA256  vhba.tar.xz" | sha256sum -c -
          tar xf vhba.tar.xz
          make -C "$VHBA" "KDIR=/lib/modules/$(uname -r)/build"
          sudo insmod "$VHBA/vhba.ko"

      - name: Cut a disc
        run: |
          head -c $((2352 * 750)) /dev/urandom > disc.bin
          printf 'FILE "disc.bin" BINARY\n  TRACK 01 AUDIO\n    INDEX 01 00:00:00\n' > disc.cue
          chmod 444 disc.bin disc.cue

      # Everything that needs the drive happens in one step, because the daemon
      # answering for it lives exactly as long as this shell.
      #
      # Every test the Rust side has, and not only the ripping, because the
      # point is to notice a write that nobody meant to add. A rule that only
      # covers the code somebody remembered to point this at is not much of a
      # rule.
      #
      # The device is left writable on purpose. Nothing was written to a drive
      # that could not be written to would be worth nothing to say: the app has
      # to be free to write and not do it.
      - name: Use the drive while the kernel writes down what it is asked
        run: |
          set -eux
          sudo sh -c 'echo 1 > /sys/kernel/debug/tracing/events/scsi/scsi_dispatch_cmd_start/enable'
          sudo sh -c ': > /sys/kernel/debug/tracing/trace'

          dbus-run-session -- bash -c '
            set -eux
            cdemu-daemon --bus session &
            sleep 5
            cdemu load 0 "$GITHUB_WORKSPACE/disc.cue"
            sleep 5
            sudo chmod a+rw /dev/sr0

            cd "$GITHUB_WORKSPACE/src-tauri"
            cargo test --all-features
            cargo run --example rip -- /dev/sr0 "$GITHUB_WORKSPACE/ripped"
          '

          sudo cat /sys/kernel/debug/tracing/trace > trace.txt
          sudo sh -c 'echo 0 > /sys/kernel/debug/tracing/events/scsi/scsi_dispatch_cmd_start/enable'

      # Other drives on the machine are somebody else's business. This is the
      # one the app was given.
      - name: Keep what was sent to that drive
        run: |
          set -eux
          host=$(readlink -f /sys/block/sr0/device | grep -oE 'host[0-9]+' | head -1 | tr -dc '0-9')
          grep "host_no=$host " trace.txt > drive.txt
          cat drive.txt

      # Without this, the assertion after it would pass just as happily on a
      # recording that never started. "No writes were recorded" and "nothing
      # was recorded" are the same sentence until something says otherwise.
      - name: The drive was asked to read
        run: grep -qE 'cmnd=\(READ' drive.txt

      - name: The drive was never asked to write
        run: |
          ! grep -qE 'cmnd=\((WRITE|ERASE|BLANK|FORMAT_UNIT|CLOSE_TRACK|RESERVE_TRACK)' drive.txt

      # The evidence itself, kept where somebody who wants to check can read it
      # rather than only the word that it passed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commands-the-drive-was-sent
          path: drive.txt

  file-side-effects:
    name: should not create, modify or delete unrelated files or directories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-diff-allowlist
        with:
          # Installing the toolchain here rather than in `run` keeps it out of
          # the diff, which then covers running the tests and nothing else.
          setup: |
            apt-get update
            # Verbatim from the Tauri Linux prerequisites. Unlike the list in
            # .github/actions/setup-tauri-linux, which only tops up a runner
            # image, this one targets a bare system.
            apt-get install --yes \
              libwebkit2gtk-4.1-dev \
              build-essential \
              curl \
              wget \
              file \
              libxdo-dev \
              libssl-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev
            # What the ripping links against, and the clang that turns its
            # headers into bindings. Separate from the list above so that the
            # Tauri prerequisites stay quotable against their own page.
            apt-get install --yes \
              libcdio-dev \
              libcdio-cdda-dev \
              libcdio-paranoia-dev \
              libclang-dev \
              pkg-config
            # A bare Ubuntu image ships no CA bundle, which every download
            # below needs.
            apt-get install --yes ca-certificates
            rm -rf /var/lib/apt/lists/*
            export VOLTA_HOME=/usr/local/volta
            export PATH="$VOLTA_HOME/bin:$PATH"
            curl --proto '=https' --tlsv1.2 --silent --show-error --fail https://get.volta.sh \
              | bash -s -- --skip-setup
            # Volta fetches the Node pinned in package.json on the first call,
            # so the version stays declared in one place.
            node --version
            # Volta shims node but not corepack, and corepack is what keeps
            # pnpm on the version pinned by the packageManager field. Enabling
            # it into Volta's bin directory is what puts pnpm on PATH for the
            # test run; corepack itself never gets a shim, hence the full paths.
            node_bin="$(dirname "$(volta which node)")"
            "$node_bin/corepack" enable --install-directory "$VOLTA_HOME/bin"
            "$node_bin/corepack" install
            pnpm install --frozen-lockfile
            # The browser Vitest drives. Downloading it here rather than in
            # `run` keeps the download itself out of the diff.
            pnpm exec playwright install --with-deps chromium
            curl --proto '=https' --tlsv1.2 --silent --show-error --fail https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            # The bindings the frontend imports, built here rather than left to
            # the pre script in `run`, which would pull a whole Rust build into
            # what the diff is meant to be measuring.
            pnpm run generate-bindings
            cd src-tauri
            cargo fetch --locked
          run: |
            export VOLTA_HOME=/usr/local/volta
            export PATH="$VOLTA_HOME/bin:$HOME/.cargo/bin:$PATH"
            pnpm run vitest run
            cd src-tauri
            cargo test --all-features
          # Measured against a real run: the two suites write below the working
          # directory apart from these two caches, which the browser and
          # fontconfig fill in the first time the browser starts.
          allowed-paths: |
            /root/.cache/ms-playwright
            /var/cache/fontconfig
