name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oxlint:
    name: Oxlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  oxfmt:
    name: Oxfmt
    permissions:
      contents: read
    uses: yuyuyuyuyu-dev/repo-config/.github/workflows/oxfmt.yml@main

  specification:
    name: Specification
    uses: ./.github/workflows/specification.yml

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: ./.github/actions/setup-udev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: pnpm install --frozen-lockfile
      - run: pnpm run tsc --noEmit

  typescript-test:
    name: TypeScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: ./.github/actions/setup-udev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run vitest run

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check
        working-directory: src-tauri

  clippy:
    name: Clippy (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
          - platform: macOS
            runner: macos-latest
          - platform: Windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tauri-linux
        if: runner.os == 'Linux'
      - uses: ./.github/actions/setup-libcdio
        if: runner.os == 'Linux'
      - uses: ./.github/actions/setup-udev
        if: runner.os == 'Linux'
      - name: Install the CD libraries the app is built against
        if: runner.os == 'macOS'
        run: brew install libcdio libcdio-paranoia
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

  rust-test:
    name: Rust tests (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
          - platform: macOS
            runner: macos-latest
          - platform: Windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tauri-linux
        if: runner.os == 'Linux'
      - uses: ./.github/actions/setup-libcdio
        if: runner.os == 'Linux'
      - uses: ./.github/actions/setup-udev
        if: runner.os == 'Linux'
      - name: Install the CD libraries the app is built against
        if: runner.os == 'macOS'
        run: brew install libcdio libcdio-paranoia
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --all-features
        working-directory: src-tauri
