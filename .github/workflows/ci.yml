name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  biome:
    name: Biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run biome ci

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm run tsc --noEmit

  typescript-test:
    name: TypeScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run vitest run

  # The Rust jobs install no toolchain: rustup ships on the runner and honours
  # src-tauri/rust-toolchain.toml, installing the pinned version and the
  # components listed there on the first cargo invocation.
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check
        working-directory: src-tauri

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --all-features
        working-directory: src-tauri

  # On macOS for the last assertion: Apple's decoder refused a file every other
  # decoder accepted, and it exists nowhere else.
  rip:
    name: should rip as FLAC Uncompressed
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # The reference FLAC tools judge the file by something other than the
      # library that wrote it.
      - run: brew install libcdio libcdio-paranoia flac

      # libcdio reads an image through the interface it reads a drive through,
      # so a runner with no drive can be handed a disc. The audio is random
      # because a pattern could be reproduced by an encoder that lost it.
      - name: Put a disc in the drive
        run: |
          head -c $((2352 * 750)) /dev/urandom > disc.bin
          printf 'FILE "disc.bin" BINARY\n  TRACK 01 AUDIO\n    INDEX 01 00:00:00\n' > disc.cue
          chmod 444 disc.bin disc.cue

      # Ten, because one run would otherwise be one bit of evidence about
      # something that has come out differently once in four runs, and reading
      # ten seconds of audio costs a second.
      - name: Rip the same disc ten times
        run: |
          for attempt in $(seq 1 10); do
            cargo run --example rip -- \
              "$GITHUB_WORKSPACE/disc.cue" "$GITHUB_WORKSPACE/ripped-$attempt"
          done
        working-directory: src-tauri

      # Two rips of one disc that disagree mean one of them is wrong and the
      # app cannot say which. Which of these two fails says where to look: files
      # that differ from each other put it in the reading, files that agree with
      # each other and not with the disc put it somewhere steadier than that.
      - name: Every attempt read the same disc the same way
        run: |
          shasum -a 256 ripped-*/01.flac
          for attempt in $(seq 2 10); do
            cmp ripped-1/01.flac "ripped-$attempt/01.flac"
          done

      - name: Every attempt reads back as the audio that was on the disc
        run: |
          for attempt in $(seq 1 10); do
            flac --decode --force-raw-format --endian=little --sign=signed \
              --output-name="decoded-$attempt.raw" "ripped-$attempt/01.flac"
            cmp "decoded-$attempt.raw" disc.bin
          done

      # Asked of the file rather than inferred from its size, which says
      # nothing here: audio this incompressible comes out the same size either
      # way, byte for byte. A verbatim subframe is the one kind that holds
      # samples as they arrived, and independent channels are the one
      # arrangement that stores a channel rather than a difference.
      - name: Every sample in it is stored as it arrived
        run: |
          flac --analyze ripped-1/01.flac
          test "$(grep -o 'type=[A-Z]*' ripped-1/01.ana | sort -u)" = "type=VERBATIM"
          test "$(grep -o 'channel_assignment=[A-Z_]*' ripped-1/01.ana | sort -u)" \
             = "channel_assignment=INDEPENDENT"

      - name: The reference implementation accepts it
        run: flac --test ripped-1/01.flac

      # A file states the smallest of its blocks excluding the last, so a fixed
      # block size is stated twice. Wrong, it decodes everywhere but on Apple.
      - name: Its blocks are the fixed size it says they are
        run: |
          test "$(metaflac --show-min-blocksize ripped-1/01.flac)" \
             = "$(metaflac --show-max-blocksize ripped-1/01.flac)"

      # afconvert rather than afplay: the same Core Audio decoder, but a runner
      # has no speaker and the null device it gets instead often fails to appear.
      - name: Apple's decoder plays it
        run: afconvert -f WAVE -d LEI16 ripped-1/01.flac played.wav

      # A disagreement is worth having in hand rather than only in a log line.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: the-disc-and-what-came-off-it
          path: |
            disc.bin
            ripped-*/01.flac

  # Pinned to a release: this depends on the runner being able to run a machine
  # inside itself, which should not move underfoot.
  disc-writes:
    name: should not write to a disc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # A job that quietly does nothing keeps claiming what it stopped checking.
      - name: The runner can run a machine inside itself
        run: test -e /dev/kvm

      - run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-x86 qemu-utils cloud-image-utils
          sudo chmod 666 /dev/kvm

      - name: Use the drive while the kernel writes down what it is asked
        run: .github/scripts/use-a-drive-in-a-virtual-machine.sh

      # The audio, by its opcode, rather than any command with READ in its
      # name. The table of contents is read by the kernel on its own, so
      # asking only for that passed on a run where the app never read a note.
      - name: The drive was asked for the audio
        run: grep -qE 'raw=(be|28) ' drive.txt

      - name: The drive was never asked to write
        run: |
          ! grep -qE 'cmnd=\((WRITE|ERASE|BLANK|FORMAT_UNIT|CLOSE_TRACK|RESERVE_TRACK)' drive.txt

      # The evidence, so the claim can be checked rather than believed. The
      # console comes too: when the machine fails, it is the only account.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commands-the-drive-was-sent
          path: |
            drive.txt
            trace.txt
            vm-console.log

  file-side-effects:
    name: should not create, modify or delete unrelated files or directories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-diff-allowlist
        with:
          # Installing the toolchain here rather than in `run` keeps it out of
          # the diff, which then covers running the tests and nothing else.
          setup: |
            apt-get update
            # Verbatim from the Tauri Linux prerequisites. Unlike the list in
            # .github/actions/setup-tauri-linux, which only tops up a runner
            # image, this one targets a bare system.
            apt-get install --yes \
              libwebkit2gtk-4.1-dev \
              build-essential \
              curl \
              wget \
              file \
              libxdo-dev \
              libssl-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev
            # Separate from the list above so the Tauri prerequisites stay
            # quotable against their own page.
            apt-get install --yes \
              libcdio-dev \
              libcdio-cdda-dev \
              libcdio-paranoia-dev \
              libclang-dev \
              pkg-config
            # A bare Ubuntu image ships no CA bundle, which every download
            # below needs.
            apt-get install --yes ca-certificates
            rm -rf /var/lib/apt/lists/*
            export VOLTA_HOME=/usr/local/volta
            export PATH="$VOLTA_HOME/bin:$PATH"
            curl --proto '=https' --tlsv1.2 --silent --show-error --fail https://get.volta.sh \
              | bash -s -- --skip-setup
            # Volta fetches the Node pinned in package.json on the first call,
            # so the version stays declared in one place.
            node --version
            # Volta shims node but not corepack, and corepack is what keeps
            # pnpm on the version pinned by the packageManager field. Enabling
            # it into Volta's bin directory is what puts pnpm on PATH for the
            # test run; corepack itself never gets a shim, hence the full paths.
            node_bin="$(dirname "$(volta which node)")"
            "$node_bin/corepack" enable --install-directory "$VOLTA_HOME/bin"
            "$node_bin/corepack" install
            pnpm install --frozen-lockfile
            # The browser Vitest drives. Downloading it here rather than in
            # `run` keeps the download itself out of the diff.
            pnpm exec playwright install --with-deps chromium
            curl --proto '=https' --tlsv1.2 --silent --show-error --fail https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            # The bindings the frontend imports, built here rather than left to
            # the pre script in `run`, which would pull a whole Rust build into
            # what the diff is meant to be measuring.
            pnpm run generate-bindings
            cd src-tauri
            cargo fetch --locked
          run: |
            export VOLTA_HOME=/usr/local/volta
            export PATH="$VOLTA_HOME/bin:$HOME/.cargo/bin:$PATH"
            pnpm run vitest run
            cd src-tauri
            cargo test --all-features
          # Measured against a real run: the two suites write below the working
          # directory apart from these two caches, which the browser and
          # fontconfig fill in the first time the browser starts.
          allowed-paths: |
            /root/.cache/ms-playwright
            /var/cache/fontconfig
