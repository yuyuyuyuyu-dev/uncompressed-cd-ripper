name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  biome:
    name: Biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run biome ci

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # The generate-licenses script the pre scripts run reads the crate
      # licenses through this.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: pnpm install --frozen-lockfile
      - run: pnpm run tsc --noEmit

  typescript-test:
    name: TypeScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # The generate-licenses script the pre scripts run reads the crate
      # licenses through this.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run vitest run

  # The Rust jobs install no toolchain: rustup ships on the runner and honours
  # src-tauri/rust-toolchain.toml, installing the pinned version and the
  # components listed there on the first cargo invocation.
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check
        working-directory: src-tauri

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --all-features
        working-directory: src-tauri

  # On macOS for the last assertion: Apple's decoder refused a file every other
  # decoder accepted, and it exists nowhere else.
  rip:
    name: should rip as FLAC Uncompressed
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # So the file is judged by something other than what wrote it.
      - run: brew install libcdio libcdio-paranoia flac

      # libcdio reads an image through the interface it reads a drive through.
      - name: Put a disc in the drive
        run: |
          .github/scripts/make-a-test-disc.py "$GITHUB_WORKSPACE"
          chmod 444 disc.bin disc.cue

      - run: |
          cargo run --example rip -- \
            --disc "$GITHUB_WORKSPACE/disc.cue" -o "$GITHUB_WORKSPACE/ripped"
        working-directory: src-tauri

      - name: It reads back as the audio that was on the disc
        run: |
          flac --decode --force-raw-format --endian=little --sign=signed \
            --output-name=decoded.raw ripped/01.flac
          cmp decoded.raw disc.bin

      # A verbatim subframe holds samples as they arrived, and independent
      # channels store a channel rather than a difference against the other.
      - name: Every sample in it is stored as it arrived
        run: |
          flac --analyze ripped/01.flac
          test "$(grep -o 'type=[A-Z]*' ripped/01.ana | sort -u)" = "type=VERBATIM"
          test "$(grep -o 'channel_assignment=[A-Z_]*' ripped/01.ana | sort -u)" \
             = "channel_assignment=INDEPENDENT"

      - name: The reference implementation accepts it
        run: flac --test ripped/01.flac

      # Stated twice for a fixed block size, since the smallest excludes the
      # last. Wrong, it decodes everywhere but on Apple.
      - name: Its blocks are the fixed size it says they are
        run: |
          test "$(metaflac --show-min-blocksize ripped/01.flac)" \
             = "$(metaflac --show-max-blocksize ripped/01.flac)"

      # The same decoder as afplay, without needing a speaker the runner has
      # not got.
      - name: Apple's decoder plays it
        run: afconvert -f WAVE -d LEI16 ripped/01.flac played.wav

      # A disagreement is worth having in hand, not just in a log.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: the-disc-and-what-came-off-it
          path: |
            disc.bin
            ripped/01.flac

  # The job above rips a disc nobody looked one thing up about. This one hands
  # the rip what a lookup would have answered and asks a tool from the other
  # side of the format what came out. Ubuntu rather than macOS: nothing here
  # turns on how a decoder behaves, so the cheaper runner will do.
  metadata:
    name: should write the fetched metadata into the file a track is ripped to
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # So the tags are read by something other than what wrote them.
      - run: sudo apt-get install --yes flac

      - name: Put a disc in the drive
        run: |
          .github/scripts/make-a-test-disc.py "$GITHUB_WORKSPACE"
          chmod 444 disc.bin disc.cue

      - name: Rip it as a disc that was looked up
        run: |
          cargo run --example rip -- \
            --disc "$GITHUB_WORKSPACE/disc.cue" -o "$GITHUB_WORKSPACE/ripped" \
            --album-name "Sea Change" --album-artist-name "Marina Blue" \
            --track-title "Harbour Lights"
        working-directory: src-tauri

      # Reached by the name the title had to have got into, so a title that
      # never left the lookup fails here rather than passing quietly.
      - name: A player reads back what the lookup answered
        run: |
          ls -la ripped
          metaflac --export-tags-to=- "ripped/01 - Harbour Lights.flac" | tee tags.txt
          grep -qxF 'TITLE=Harbour Lights' tags.txt
          grep -qxF 'ARTIST=Marina Blue' tags.txt
          grep -qxF 'ALBUM=Sea Change' tags.txt
          grep -qxF 'ALBUMARTIST=Marina Blue' tags.txt
          grep -qxF 'TRACKNUMBER=1' tags.txt

  # The jobs above rip discs whose files carry nothing but audio and tags. This
  # one hands the rip album artwork off this computer and asks a tool from the
  # other side of the format what came out.
  artwork:
    name: should write the chosen album artwork into the file a track is ripped to
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # So the artwork is read back by something other than what wrote it.
      - run: sudo apt-get install --yes flac

      - name: Put a disc in the drive
        run: |
          .github/scripts/make-a-test-disc.py "$GITHUB_WORKSPACE"
          chmod 444 disc.bin disc.cue

      # Artwork rather than something standing in for it: one red pixel, which
      # is about the smallest a PNG comes, and the same one the test cases use.
      - name: Put artwork on this computer
        run: |
          base64 --decode > artwork.png <<'PNG'
          iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGP4z8AAAAMBAQDJ/pLvAAAAAElFTkSuQmCC
          PNG

      # Nothing else is given, so the artwork is all the rip is told: a disc
      # nobody looked up can still be given its artwork.
      - name: Rip it with artwork chosen from this computer
        run: |
          cargo run --example rip -- \
            --disc "$GITHUB_WORKSPACE/disc.cue" -o "$GITHUB_WORKSPACE/ripped" \
            --album-artwork "$GITHUB_WORKSPACE/artwork.png"
        working-directory: src-tauri

      # What the block says it holds, and then the artwork itself: a block that
      # named the wrong kind is artwork no player draws, and one that held the
      # wrong bytes is somebody else's.
      - name: A player finds the artwork that was chosen
        run: |
          metaflac --list --block-type=PICTURE ripped/01.flac | tee block.txt
          grep -qF 'MIME type: image/png' block.txt
          metaflac --export-picture-to=exported.png ripped/01.flac
          cmp artwork.png exported.png

  # Every drive hands over samples a little further along the disc than the
  # sectors it was asked for, or a little further back, and putting that right
  # happens below the seam the Rust cases drive: it is in the code that talks
  # to libcdio. A job reaches it, because the disc image is the same every
  # time, so what comes back with an offset applied is that image moved along
  # by exactly that much.
  read-offset:
    name: should correct for the drive's read offset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # So what came off the disc is read back by something other than what
      # wrote it.
      - run: sudo apt-get install --yes flac

      - name: Put a disc in the drive
        run: |
          .github/scripts/make-a-test-disc.py "$GITHUB_WORKSPACE"
          chmod 444 disc.bin disc.cue

      # 667 is a real drive's offset, and is not a whole number of the 588
      # frames a sector holds: the samples wanted begin part way into one
      # sector and end part way into another, so the reading has to be cut up
      # again against the track rather than against the disc.
      - name: Rip it as a drive that reads 667 frames ahead
        run: |
          cargo run --example rip -- \
            --disc "$GITHUB_WORKSPACE/disc.cue" -o "$GITHUB_WORKSPACE/ahead" \
            --read-offset 667
        working-directory: src-tauri

      - name: It holds the samples that far further along the disc
        run: |
          flac --decode --force-raw-format --endian=little --sign=signed \
            --output-name=ahead.raw ahead/01.flac
          .github/scripts/shift-the-disc.py disc.bin 667 expected-ahead.raw
          cmp ahead.raw expected-ahead.raw

      # The other way round, which is the one that reaches past the start of
      # the disc, where there is nothing to read and silence has to stand in.
      - name: Rip it as a drive that reads 667 frames behind
        run: |
          cargo run --example rip -- \
            --disc "$GITHUB_WORKSPACE/disc.cue" -o "$GITHUB_WORKSPACE/behind" \
            --read-offset -667
        working-directory: src-tauri

      - name: It holds the samples that far further back, silence before them
        run: |
          flac --decode --force-raw-format --endian=little --sign=signed \
            --output-name=behind.raw behind/01.flac
          .github/scripts/shift-the-disc.py disc.bin -667 expected-behind.raw
          cmp behind.raw expected-behind.raw

      # A disagreement is worth having in hand, not just in a log.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: the-disc-and-what-came-off-it-with-an-offset
          path: |
            disc.bin
            ahead.raw
            behind.raw

  # The numbers this app works out have to be the numbers everybody else's rips
  # were counted with, or a rip would match nothing however well it was read.
  # Nothing written here can state that: a case that made up its own expected
  # numbers would only say that the code does what the code does. So they come
  # from somebody else's implementation of the same algorithm, the way the jobs
  # above hold a written file against tools from the other side of the format.
  checksums:
    name: should work out the same AccurateRip checksums as another implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tauri-linux
      - uses: ./.github/actions/setup-libcdio
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ARver verifies rips against AccurateRip for a living. Only what it
      # needs to work a checksum out is installed: the rest of it reaches for a
      # drive and a network this job has neither of, and asks for libraries
      # that would have to be built against libcdio. The wheel it ships is
      # built already and carries the libraries that read a file with it.
      - name: Fetch the other implementation
        run: |
          python3 -m venv theirs
          theirs/bin/pip install --no-deps ARver

      - name: Put a disc in the drive
        run: |
          .github/scripts/make-a-test-disc.py "$GITHUB_WORKSPACE"
          chmod 444 disc.bin disc.cue

      # One track, which is both the first on the disc and the last, so both
      # of the stretches AccurateRip leaves out of a checksum are left out of
      # this one. Cargo's own chatter goes to the error stream, so what lands
      # in the file is the line the rip prints and nothing else.
      - name: Rip it, and take down what it made of the track
        run: |
          cargo run --example rip -- \
            --disc "$GITHUB_WORKSPACE/disc.cue" -o "$GITHUB_WORKSPACE/ripped" \
            > "$GITHUB_WORKSPACE/ours.txt"
        working-directory: src-tauri

      # Track one of one, so both of the stretches AccurateRip leaves out are
      # left out on their side as well as on ours. Their interpreter rather
      # than the runner's, because that is the one they were installed into.
      - name: The other implementation works out the same two numbers
        run: |
          theirs/bin/python \
            .github/scripts/checksums-from-another-implementation.py \
            ripped/01.flac 1 1 > theirs.txt
          ours="$(awk '{ print $2, $3 }' ours.txt)"
          theirs="$(cat theirs.txt)"
          echo "ours:   $ours"
          echo "theirs: $theirs"
          test "$ours" = "$theirs"

  # Pinned to a release: this depends on the runner being able to run a machine
  # inside itself, which should not move underfoot.
  disc-writes:
    name: should not write to a disc
    runs-on: ubuntu-24.04
    # It waits on a machine coming up, and one that never does would otherwise
    # sit here for six hours. A run takes six minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # A job that quietly does nothing keeps claiming what it stopped checking.
      - name: The runner can run a machine inside itself
        run: test -e /dev/kvm

      - run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-x86 qemu-utils cloud-image-utils
          sudo chmod 666 /dev/kvm

      - name: Use the drive while the kernel writes down what it is asked
        run: .github/scripts/collect-the-commands-the-drive-is-sent.sh

      # The audio, by its opcode, rather than any command with READ in its
      # name. The table of contents is read by the kernel on its own, so
      # asking only for that passed on a run where the app never read a note.
      - name: The drive was asked for the audio
        run: grep -qE 'raw=(be|28) ' drive.txt

      - name: The drive was never asked to write
        run: |
          ! grep -qE 'cmnd=\((WRITE|ERASE|BLANK|FORMAT_UNIT|CLOSE_TRACK|RESERVE_TRACK)' drive.txt

      # The evidence, so the claim can be checked rather than believed. The
      # console comes too: when the machine fails, it is the only account.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commands-the-drive-was-sent
          path: |
            drive.txt
            trace.txt
            vm-console.log

  file-side-effects:
    name: should not create, modify or delete unrelated files or directories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-diff-allowlist
        with:
          # Installing the toolchain here rather than in `run` keeps it out of
          # the diff, which then covers running the tests and nothing else.
          setup: |
            apt-get update
            # Verbatim from the Tauri Linux prerequisites. Unlike the list in
            # .github/actions/setup-tauri-linux, which only tops up a runner
            # image, this one targets a bare system.
            apt-get install --yes \
              libwebkit2gtk-4.1-dev \
              build-essential \
              curl \
              wget \
              file \
              libxdo-dev \
              libssl-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev
            # Separate from the list above so the Tauri prerequisites stay
            # quotable against their own page.
            apt-get install --yes \
              libcdio-dev \
              libcdio-cdda-dev \
              libcdio-paranoia-dev \
              libclang-dev \
              pkg-config
            # A bare Ubuntu image ships no CA bundle, which every download
            # below needs.
            apt-get install --yes ca-certificates
            rm -rf /var/lib/apt/lists/*
            export VOLTA_HOME=/usr/local/volta
            export PATH="$VOLTA_HOME/bin:$PATH"
            curl --proto '=https' --tlsv1.2 --silent --show-error --fail https://get.volta.sh \
              | bash -s -- --skip-setup
            # Volta fetches the Node pinned in package.json on the first call,
            # so the version stays declared in one place.
            node --version
            # Volta shims node but not corepack, and corepack is what keeps
            # pnpm on the version pinned by the packageManager field. Enabling
            # it into Volta's bin directory is what puts pnpm on PATH for the
            # test run; corepack itself never gets a shim, hence the full paths.
            node_bin="$(dirname "$(volta which node)")"
            "$node_bin/corepack" enable --install-directory "$VOLTA_HOME/bin"
            "$node_bin/corepack" install
            pnpm install --frozen-lockfile
            # The browser Vitest drives. Downloading it here rather than in
            # `run` keeps the download itself out of the diff.
            pnpm exec playwright install --with-deps chromium
            curl --proto '=https' --tlsv1.2 --silent --show-error --fail https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            # What reads the crate licenses. Compiled rather than fetched as a
            # release binary, and that binary only comes with the cli feature.
            # From src-tauri, because the toolchain file rustup reads lives
            # there and the install above pinned no toolchain.
            (cd src-tauri && cargo install --locked --features cli cargo-about)
            # The bindings the frontend imports and the list of licenses, built
            # here rather than left to the pre scripts in `run`, which would pull
            # a whole Rust build into what the diff is meant to be measuring.
            pnpm run generate-bindings
            pnpm run generate-licenses
            cd src-tauri
            cargo fetch --locked
          run: |
            export VOLTA_HOME=/usr/local/volta
            export PATH="$VOLTA_HOME/bin:$HOME/.cargo/bin:$PATH"
            pnpm run vitest run
            cd src-tauri
            cargo test --all-features
          # Measured against a real run: the two suites write below the working
          # directory apart from these three. The browser and fontconfig fill
          # the first two in the first time the browser starts. The third is
          # where Cargo notes down what of the registry it has used, which it
          # does while the licenses are being read.
          allowed-paths: |
            /root/.cache/ms-playwright
            /var/cache/fontconfig
            /root/.cargo/.global-cache
