name: Setup Tauri (Linux)
description: Installs the system libraries Tauri links against on Ubuntu runners.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf \
          xdg-utils
