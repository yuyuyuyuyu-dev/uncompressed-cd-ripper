name: Setup Tauri (Linux)
description: Installs the system libraries Tauri links against on Ubuntu runners.

runs:
  using: composite
  steps:
    # Tauri links against the system WebKitGTK at build time, so even `cargo
    # clippy` and `cargo test` fail without these on a bare Ubuntu runner.
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          libxdo-dev \
          libssl-dev \
          patchelf
