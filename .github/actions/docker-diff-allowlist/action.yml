name: docker diff allowlist
description: Fails when a command creates, modifies or deletes a file outside an allowlist.

inputs:
  image:
    description: >-
      Base image the command runs in. It needs a POSIX shell. Defaults to the
      image pinned in the action's base-image.Dockerfile.
    required: false
    default: ""
  workdir:
    description: Directory the checkout is copied to and the command runs in.
    required: false
    default: /workspace
  setup:
    description: >-
      Commands preparing the environment, run as `sh -e` while the image is
      built. Their file changes end up in the image and are therefore not part
      of the diff.
    required: false
    default: ""
  run:
    description: Command whose file changes are verified, run as `sh -e`.
    required: true
  allowed-paths:
    description: >-
      Newline separated absolute paths the command may create, modify or
      delete, on top of `workdir`, which is always allowed. An entry covers
      itself and everything below it. Blank lines and lines starting with `#`
      are ignored.
    required: true

runs:
  using: composite
  steps:
    # `docker diff` reports the writable layer of a container, so the checkout
    # has to be copied into the image: whatever the command writes under a bind
    # mount or a volume stays invisible to this check.
    - name: Build the image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        WORKDIR: ${{ inputs.workdir }}
        SETUP: ${{ inputs.setup }}
      run: |
        name=docker-diff-allowlist-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
        if [[ -z ${IMAGE//[[:space:]]/} ]]; then
          IMAGE=$(sed -n 's/^FROM[[:space:]]\{1,\}//p' "$GITHUB_ACTION_PATH/base-image.Dockerfile")
        fi
        {
          printf 'FROM %s\n' "$IMAGE"
          printf 'ARG SETUP\n'
          printf 'WORKDIR %s\n' "$WORKDIR"
          printf 'COPY . %s\n' "$WORKDIR"
          printf 'RUN sh -e -c "$SETUP"\n'
        } > "$RUNNER_TEMP/$name.dockerfile"
        docker build --file "$RUNNER_TEMP/$name.dockerfile" --build-arg SETUP --tag "$name" .

    # Some runtime and storage driver combinations leave marks of their own in
    # the writable layer, the /etc files Docker bind mounts being the usual
    # ones. Recording a container that ran nothing keeps whatever those are out
    # of every caller's allowlist.
    - name: Record the changes the container runtime makes on its own
      shell: bash
      run: |
        name=docker-diff-allowlist-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
        docker run --name "$name-runtime" "$name" sh -e -c ':'

    - name: Run the command
      shell: bash
      env:
        COMMAND: ${{ inputs.run }}
      run: |
        # The runner does not enforce `required` on action inputs, so an
        # unset `run` would otherwise diff a container that did nothing and
        # report success.
        if [[ -z ${COMMAND//[[:space:]]/} ]]; then
          echo "::error::the run input is empty, so there is nothing to verify"
          exit 1
        fi
        name=docker-diff-allowlist-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
        docker run --name "$name-command" "$name" sh -e -c "$COMMAND"

    - name: Verify that the command changed allowed paths only
      shell: bash
      env:
        WORKDIR: ${{ inputs.workdir }}
        ALLOWED_PATHS: ${{ inputs.allowed-paths }}
      run: |
        name=docker-diff-allowlist-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
        docker diff "$name-runtime" | LC_ALL=C sort > "$RUNNER_TEMP/$name-runtime.txt"
        docker diff "$name-command" | LC_ALL=C sort > "$RUNNER_TEMP/$name-command.txt"
        LC_ALL=C comm -13 "$RUNNER_TEMP/$name-runtime.txt" "$RUNNER_TEMP/$name-command.txt" > "$RUNNER_TEMP/$name-changes.txt"

        # A command rewriting the checked out sources shows up in `git diff`
        # long before it reaches this check, so the working directory is left
        # to Git rather than spelled out by every caller.
        allowed=("${WORKDIR%/}")
        while IFS= read -r line; do
          entry=${line#"${line%%[![:space:]]*}"}
          entry=${entry%"${entry##*[![:space:]]}"}
          if [[ -z $entry || $entry == '#'* ]]; then
            continue
          fi
          allowed+=("${entry%/}")
        done <<< "$ALLOWED_PATHS"

        violations=()
        while IFS= read -r change; do
          if [[ -z $change ]]; then
            continue
          fi
          kind=${change:0:1}
          path=${change:2}
          for entry in "${allowed[@]}"; do
            if [[ $path == "$entry" || $path == "$entry"/* ]]; then
              continue 2
            fi
            # An allowed path cannot appear without its parent directories being
            # created or touched, so only their deletion is a real violation.
            if [[ $kind != D && $entry == "$path"/* ]]; then
              continue 2
            fi
          done
          violations+=("$change")
        done < "$RUNNER_TEMP/$name-changes.txt"

        if (( ${#violations[@]} == 0 )); then
          echo "The command changed allowed paths only."
          exit 0
        fi

        limit=200
        report=$(printf '%s\n' "${violations[@]:0:$limit}")
        if (( ${#violations[@]} > limit )); then
          report+=$'\n'"... and $(( ${#violations[@]} - limit )) more"
        fi

        echo "::error::${#violations[@]} file change(s) outside the allowlist"
        echo "$report"

        {
          echo '### File changes outside the allowlist'
          echo
          echo '`A` created, `C` modified, `D` deleted.'
          echo
          echo '```'
          echo "$report"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        exit 1

    - name: Remove the containers
      if: always()
      shell: bash
      run: |
        name=docker-diff-allowlist-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
        docker rm --force "$name-runtime" "$name-command" || true
