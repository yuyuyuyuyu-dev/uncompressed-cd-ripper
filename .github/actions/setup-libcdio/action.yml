name: Setup libcdio
description: Installs the CD reading libraries the ripping links against on Ubuntu runners.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libcdio-dev \
          libcdio-cdda-dev \
          libcdio-paranoia-dev \
          libclang-dev
