name: Setup libcdio
description: Installs the CD reading libraries the ripping links against on Ubuntu runners.

runs:
  using: composite
  steps:
    # libcdio-sys links against the system libcdio and generates bindings from
    # its headers, so both it and clang must be here before anything compiles
    # the crate. cdda is listed because paranoia is built on it and pkg-config
    # is asked for both.
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libcdio-dev \
          libcdio-cdda-dev \
          libcdio-paranoia-dev \
          libclang-dev
