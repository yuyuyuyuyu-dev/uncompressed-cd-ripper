[package]
name = "uncompressed-cd-ripper"
version = "0.0.0-SNAPSHOT"
description = "This app rips CDs without compression."
authors = ["yu"]
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "uncompressed_cd_ripper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["specta"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
chrono = "0.4"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
sentry-types = "0.49.1"
os_info = "3.15.0"
tauri-plugin-dialog = "2"
flacenc = "0.5.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-store = "2"
cdtoc = { version = "0.13", default-features = false, features = [
    "accuraterip",
    "musicbrainz",
] }
tauri-plugin-log = "2.9.0"
log = "0.4.34"
tauri-plugin-process = "2"

[target.'cfg(not(windows))'.dependencies]
libcdio-sys = { version = "2.0.0", default-features = false, features = [
    "paranoia",
] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8.7"

[target.'cfg(target_os = "linux")'.dependencies]
udev = "0.9.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Devices_Cdrom",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
debug = "line-tables-only"
