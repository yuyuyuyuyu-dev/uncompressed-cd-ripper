[package]
name = "uncompressed-cd-ripper"
version = "0.0.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# The app is not a library for anyone to depend on, and saying so is what
# keeps it out of its own list of dependency licenses.
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "uncompressed_cd_ripper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The specta feature lets a command take a channel the frontend reads progress
# from, declared once on this side.
tauri = { version = "2", features = ["specta"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The cover art travels to the window and back as text, because what carries
# it is JSON.
base64 = "0.23.1"
chrono = "0.4"
# Tauri Specta is in beta and asks for exact versions, because a future release
# is free to break the generated bindings.
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
sentry-types = "0.49.1"
os_info = "3.15.0"
tauri-plugin-dialog = "2"
flacenc = "0.5.1"
tauri-plugin-notification = "2.3.3"
# A drive's read offset belongs to the drive and is worth keeping between runs.
# Tauri's own store rather than a file written by hand: it settles where a
# settings file goes on each of the three platforms, and writing that by hand
# is the part that would go wrong.
tauri-plugin-store = "2"
# The ID MusicBrainz knows a disc by is a SHA-1 over its table of contents laid
# out just so, in a base64 with three characters swapped. What is easy to get
# wrong is the disc that carries data as well as audio, where the gap between
# the two sessions comes off the lead-out first, and this knows to do it.
#
# The same table of contents gives AccurateRip the three numbers it knows a
# disc by and the address its checksums are kept at, and this also reads back
# the two files that come from there, both of which are raw bytes rather than
# anything a person would read. Only the two services are turned on, so the
# code behind the other ID scheme never reaches the app.
#
# Held at 0.13 because 0.14 wants a newer compiler than rust-toolchain.toml
# pins.
cdtoc = { version = "0.13", default-features = false, features = [
    "accuraterip",
    "musicbrainz",
] }
tauri-plugin-log = "2.9.0"
log = "0.4.34"

[target.'cfg(not(windows))'.dependencies]
# No pure Rust library reads audio off a CD as accurately: libcdio-paranoia is
# what cdparanoia grew into, and re-reads until the samples agree. It is GPL,
# which the whole app therefore is. Filesystem features off: this reads audio.
libcdio-sys = { version = "2.0.0", default-features = false, features = [
    "paranoia",
] }
# For SEEK_SET, which belongs to libc so the libcdio bindings do not carry it.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8.7"

[target.'cfg(target_os = "linux")'.dependencies]
udev = "0.9.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Devices_Cdrom",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# Line tables leave file and line in a backtrace without carrying types or
# variables. Independent of opt-level: the machine code is the same, and the
# binary is what grows.
debug = "line-tables-only"
