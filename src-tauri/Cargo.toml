[package]
name = "uncompressed-cd-ripper"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "uncompressed_cd_ripper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The specta feature lets a command take a channel the frontend reads progress
# from, declared once on this side.
tauri = { version = "2", features = ["specta"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
# Tauri Specta is in beta and asks for exact versions, because a future release
# is free to break the generated bindings.
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
sentry-types = "0.49.1"
os_info = "3.15.0"
tauri-plugin-dialog = "2"
# No pure Rust library reads audio off a CD as accurately: libcdio-paranoia is
# what cdparanoia grew into, and re-reads until the samples agree. It is GPL,
# which the whole app therefore is. Filesystem features off: this reads audio.
libcdio-sys = { version = "2.0.0", default-features = false, features = [
    "paranoia",
] }
# For SEEK_SET, which belongs to libc so the libcdio bindings do not carry it.
libc = "0.2"
flacenc = "0.5.1"
tauri-plugin-notification = "2.3.3"

[profile.release]
# Line tables leave file and line in a backtrace without carrying types or
# variables. Independent of opt-level: the machine code is the same, and the
# binary is what grows.
debug = "line-tables-only"
